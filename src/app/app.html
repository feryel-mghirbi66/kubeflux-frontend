<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">KubeFlux</span>
    </div>

    <nav class="nav" *ngIf="authService.isLoggedIn()">
      <ng-container *ngIf="!authService.isStockManager()">
        <a routerLink="/orders/new" routerLinkActive="active" class="nav-link">
          <span class="nav-icon">＋</span> Nouvelle commande
        </a>
        <a routerLink="/orders" routerLinkActive="active" class="nav-link">
          <span class="nav-icon">☰</span> Commandes
        </a>
      </ng-container>

      <a routerLink="/stock" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">▤</span> Stock
      </a>

      <a *ngIf="authService.isStockManager()" routerLink="/stock-manager" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">⚙</span> Gestion du stock
      </a>
    </nav>

    <div class="sidebar-footer">
      <button *ngIf="authService.isLoggedIn()" (click)="logout()" class="logout-btn">
        <span class="logout-icon">⎋</span> Déconnexion
      </button>
      <div class="status-line">
        <span class="status-dot"></span> Order &amp; Inventory Service
      </div>
    </div>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
